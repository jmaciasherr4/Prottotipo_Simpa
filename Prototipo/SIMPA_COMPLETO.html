<html lang="es">
<head>

<style>
:root{--green:#166534;--green2:#22c55e;--dark:#10231a;--bg:#f4f7f3;--card:#fff;--line:#dfe7df;--muted:#64748b;--red:#dc2626;--amber:#d97706;--blue:#2563eb;--purple:#7c3aed;--shadow:0 8px 28px rgba(16,35,26,.07)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#17211b}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0f3d25,#1b6b40 55%,#e9f4e9);padding:20px}.login-card{width:min(440px,100%);background:white;border-radius:24px;padding:34px;box-shadow:0 25px 70px #0b2d1d44}.logo{display:flex;align-items:center;gap:12px;font-weight:900;font-size:24px;color:var(--green)}.logo-mark{width:46px;height:46px;border-radius:14px;background:#dcfce7;display:grid;place-items:center;font-size:25px}.subtitle{color:var(--muted);margin:7px 0 24px}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:800;color:#475569;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green2);box-shadow:0 0 0 3px #22c55e18}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800}.btn-primary{background:var(--green);color:#fff}.btn-primary:hover{background:#14532d}.btn-secondary{background:#eef5ef;color:var(--green)}.btn-danger{background:#fee2e2;color:#991b1b}.btn-amber{background:#fff7ed;color:#9a3412}.btn-blue{background:#eff6ff;color:#1d4ed8}.btn-ghost{background:transparent;color:var(--muted)}.btn:disabled{opacity:.5;cursor:not-allowed}.demo{margin-top:16px;padding:12px;background:#f8faf8;border:1px solid var(--line);border-radius:14px;font-size:12px;color:#475569}.app{min-height:100vh}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:20}.topbar-right{display:flex;gap:10px;align-items:center}.status{font-size:11px;font-weight:800;border-radius:999px;padding:6px 9px;background:#dcfce7;color:#166534}.user-chip{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#f5f7f5;border-radius:12px;font-size:12px}.avatar{width:32px;height:32px;border-radius:10px;background:#d1fae5;color:var(--green);display:grid;place-items:center;font-weight:900}.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 68px)}.side{background:#fff;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:68px;height:calc(100vh - 68px);overflow:auto}.nav-title{font-size:10px;font-weight:900;color:#94a3b8;letter-spacing:.12em;padding:8px 10px}.nav{display:flex;flex-direction:column;gap:4px}.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:11px;color:#64748b;font-weight:750}.nav button:hover{background:#f2f7f3;color:var(--green)}.nav button.active{background:#dcfce7;color:var(--green)}main{padding:22px;max-width:1500px;width:100%;margin:auto}.page-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:18px}.page-head h1{margin:0;font-size:24px}.page-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.stat{display:flex;justify-content:space-between;align-items:flex-start}.stat .value{font-size:28px;font-weight:950}.stat .label{font-size:12px;color:var(--muted);font-weight:750}.iconbox{width:42px;height:42px;border-radius:13px;background:#ecfdf5;display:grid;place-items:center;font-size:20px}.section-title{font-size:15px;font-weight:900;margin:0 0 12px}.muted{color:var(--muted)}.small{font-size:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;background:#f8faf8;text-align:left}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}.badge{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900}.b-green{background:#dcfce7;color:#166534}.b-red{background:#fee2e2;color:#991b1b}.b-amber{background:#fef3c7;color:#92400e}.b-blue{background:#dbeafe;color:#1d4ed8}.b-purple{background:#ede9fe;color:#6d28d9}.b-gray{background:#f1f5f9;color:#475569}.progress{height:8px;background:#e8eee9;border-radius:99px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--green2);border-radius:99px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:850;color:#64748b}.tab.active{background:var(--green);border-color:var(--green);color:#fff}.alert{padding:12px;border-radius:14px;border:1px solid}.alert.red{background:#fff1f2;border-color:#fecdd3}.alert.amber{background:#fffbeb;border-color:#fde68a}.alert.blue{background:#eff6ff;border-color:#bfdbfe}.map{height:360px;border-radius:18px;background:linear-gradient(160deg,#dff3df,#b8ddb6);position:relative;overflow:hidden;border:1px solid #c5d9c4}.map:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff55 1px,transparent 1px),linear-gradient(90deg,#ffffff55 1px,transparent 1px);background-size:45px 45px}.route{position:absolute;height:4px;background:#166534;transform-origin:left center;border-radius:10px;z-index:2}.pin{position:absolute;width:15px;height:15px;border-radius:50%;border:3px solid white;box-shadow:0 2px 7px #0004;z-index:3}.chart{height:230px;display:flex;align-items:end;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);background:linear-gradient(#fff,#fbfdfb)}.bar{flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;height:100%;gap:5px}.bar i{display:block;width:72%;max-width:46px;background:var(--green2);border-radius:7px 7px 0 0;min-height:4px}.bar span{font-size:10px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0b1d1390;display:grid;place-items:center;padding:20px;z-index:100}.modal-card{background:#fff;border-radius:20px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:20px;box-shadow:0 25px 70px #0004}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal-head h2{margin:0;font-size:18px}.close{border:0;background:#f1f5f9;border-radius:10px;padding:7px 10px}.toast{position:fixed;right:20px;bottom:20px;background:#10231a;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:200;font-size:12px}.offline{background:#fff7ed;color:#9a3412}.file-preview{border:2px dashed #cbd5e1;border-radius:16px;min-height:170px;display:grid;place-items:center;text-align:center;background:#f8fafc}.kpi-good{color:#15803d}.kpi-warn{color:#b45309}.kpi-bad{color:#b91c1c}.checklist label{display:flex;gap:8px;align-items:center;padding:8px 0;font-size:12px}.footer-note{font-size:10px;color:#94a3b8;margin-top:20px;text-align:center}.mobile-nav{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:none}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:30;overflow:auto}.mobile-nav button{flex:1;min-width:80px;border:0;background:#fff;padding:9px 4px;font-size:10px;font-weight:800;color:#64748b}.mobile-nav button.active{color:var(--green)}main{padding:16px;padding-bottom:85px}.g2,.g3,.g4{grid-template-columns:1fr}.topbar{padding:0 12px}.topbar .status{display:none}.user-chip span{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const KEY='simpa_v4';
const defaults={
accounts:[{u:'admin',p:'admin123',role:'Administrador',name:'Administrador General'},{u:'supervisor',p:'super123',role:'Supervisor',name:'Asistente de Administración'},{u:'operario',p:'oper123',role:'Operario',name:'Trabajador Agrícola'}],
user:null,screen:'dashboard',
lots:[
{id:1,name:'Lote 1',variety:'Coarí × La Mé',area:18.5,palms:2700,planting:'2022-05-10',stage:'Mantenimiento'},
{id:2,name:'Lote 2',variety:'Guineensis',area:17.2,palms:2450,planting:'2021-04-20',stage:'Polinización'},
{id:3,name:'Lote 3',variety:'Coarí × La Mé',area:16.8,palms:2380,planting:'2022-06-15',stage:'Polinización'},
{id:4,name:'Lote 4',variety:'Guineensis',area:15.4,palms:2210,planting:'2020-08-02',stage:'Cosecha'},
{id:5,name:'Lote 5',variety:'Coarí × La Mé',area:14.7,palms:2070,planting:'2023-01-12',stage:'Mantenimiento'},
{id:6,name:'Lote 6',variety:'Guineensis',area:17.4,palms:2520,planting:'2021-10-09',stage:'Polinización'}],
workers:[{id:1,name:'Trabajador 1',team:'Labores agrícolas',lot:'Lote 1',phone:'0990000001',smart:true},{id:2,name:'Trabajador 2',team:'Polinización',lot:'Lote 2',phone:'0990000002',smart:true},{id:3,name:'Trabajador 3',team:'Control fitosanitario',lot:'Lote 3',phone:'0990000003',smart:false},{id:4,name:'Trabajador 4',team:'Cosecha',lot:'Lote 4',phone:'0990000004',smart:true}],
laborCatalog:[{code:'LAB-001',name:'Chapia',unit:'matas',rate:.18},{code:'LAB-002',name:'Corona',unit:'coronas',rate:.35},{code:'LAB-003',name:'Polinización',unit:'flores',rate:.12},{code:'LAB-004',name:'Sanidad vegetal',unit:'plantas',rate:.55},{code:'LAB-005',name:'Cosecha',unit:'racimos',rate:1.2},{code:'LAB-006',name:'Riego',unit:'jornales',rate:18}],
labors:[],plans:[{id:1,week:'2026-W35',lot:'Lote 2',labor:'Corona',unit:'coronas',target:1123,done:800,rate:.35},{id:2,week:'2026-W35',lot:'Lote 3',labor:'Polinización',unit:'flores',target:1200,done:980,rate:.12},{id:3,week:'2026-W35',lot:'Lote 1',labor:'Chapia',unit:'matas',target:1800,done:1700,rate:.18}],
incidents:[{id:1,lot:'Lote 2',title:'Pudrición del cogollo',severity:'Crítica',desc:'Síntomas compatibles con afectación fitosanitaria.',verified:false,lat:-1.0,lng:-79.4},{id:2,lot:'Lote 5',title:'Rhynchophorus palmarum',severity:'Crítica',desc:'Capturas por encima del umbral de acción.',verified:false,lat:-1.01,lng:-79.39}],
alerts:[{id:1,type:'Crítica',status:'Abierta',lot:'Lote 2',title:'Pudrición del cogollo detectada',desc:'Se detectaron síntomas tempranos. Se requiere inspección y acción fitosanitaria.',action:'Aislar las palmas afectadas y notificar al responsable técnico.'},{id:2,type:'Advertencia',status:'En proceso',lot:'Lote 1',title:'Déficit hídrico detectado',desc:'Humedad del suelo por debajo del umbral configurado.',action:'Revisar riego y drenaje.'},{id:3,type:'Advertencia',status:'Abierta',lot:'Lote 3',title:'Baja tasa de polinización',desc:'El avance está por debajo del objetivo semanal.',action:'Reforzar la cuadrilla de polinización.'}],
analyses:[],maturity:[],climate:[{date:'2026-08-26',rain:12.4},{date:'2026-08-27',rain:8.2},{date:'2026-08-28',rain:0},{date:'2026-08-29',rain:17.5}],tickets:[],audit:[],stageHistory:[],supplies:[],incidentsPending:[],delegated:[],consents:{},settings:{greenThreshold:3,deliveryHours:24},offlineQueue:[]
};
let db=load();let selectedLot=1;let toastTimer;
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(s){clearTimeout(toastTimer);let el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');toastTimer=setTimeout(()=>el.classList.add('hidden'),2600)}
function role(){return db.user?.role||''}function isAdmin(){return role()==='Administrador'}function isSup(){return role()==='Supervisor'||isAdmin()}
function navItems(){let a=[['dashboard','🏠','Panel principal'],['lot','🌴','Plantaciones y lotes'],['analysis','📷','Análisis IA'],['labor','📋','Labores'],['gps','📍','Mapa GPS'],['quality','🏭','Calidad / Extractora'],['reports','📊','Reportes'],['alerts','🔔','Alertas'],['climate','🌦️','Clima'],['personal','👥','Personal']];return a.filter(x=>x[0]!=='personal'||isAdmin())}
function app(){if(!db.user)return login();document.getElementById('root').innerHTML=`<div class="app"><header class="topbar"><div class="logo"><div class="logo-mark">🌴</div><div>SIMPA <small style="display:block;font-size:9px;color:#64748b;letter-spacing:.08em">MANTENIMIENTO DE PALMA</small></div></div><div class="topbar-right"><span class="status" id="net">● En línea</span><div class="user-chip"><div class="avatar">${esc(db.user.name[0])}</div><span><b>${esc(db.user.name)}</b><br><small class="muted">${esc(role())}</small></span></div><button class="btn btn-ghost" onclick="logout()">Salir</button></div></header><div class="layout"><aside class="side"><div class="nav-title">MÓDULOS</div><div class="nav">${navItems().map(x=>`<button class="${db.screen===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} &nbsp; ${x[2]}</button>`).join('')}</div><div class="footer-note">SIMPA v1 · prototipo funcional<br>ISO/IEC/IEEE 29148:2018</div></aside><main id="main"></main></div><nav class="mobile-nav">${navItems().slice(0,8).map(x=>`<button class="${db.screen===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}<br>${x[2].split(' ')[0]}</button>`).join('')}</nav></div><div id="modal" class="hidden"></div><div id="toast" class="toast hidden"></div>`;render()}
function login(){document.getElementById('root').innerHTML=`<div class="login"><div class="login-card"><div class="logo"><div class="logo-mark">🌴</div><div>SIMPA</div></div><p class="subtitle">Sistema Inteligente de Mantenimiento de Palma Africana</p><div class="field"><label>USUARIO</label><input id="lu" placeholder="admin"></div><div class="field"><label>CONTRASEÑA</label><input id="lp" type="password" placeholder="••••••••"></div><button class="btn btn-primary" style="width:100%;margin-top:6px" onclick="doLogin()">Iniciar sesión</button><div id="lerr" class="small" style="color:#b91c1c;margin-top:10px"></div><div class="demo"><b>CUENTAS DE DEMOSTRACIÓN</b><br><br>Administrador: <code>admin / admin123</code><br>Supervisor: <code>supervisor / super123</code><br>Operario: <code>operario / oper123</code></div></div></div>`}
function doLogin(){let u=document.getElementById('lu').value.trim(),p=document.getElementById('lp').value;let a=db.accounts.find(x=>x.u===u&&x.p===p);if(!a){document.getElementById('lerr').textContent='Credenciales inválidas.';return}db.user={...a};db.screen='dashboard';save();app();toast('Sesión iniciada correctamente')}
function logout(){db.user=null;save();login()}
function go(s){db.screen=s;save();render()}
function shell(title,sub,actions=''){return `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`}
function render(){let m=document.getElementById('main');if(!m)return;let f={dashboard:dashboard,lot:lotes,analysis:analysis,labor:labores,gps:gps,quality:quality,reports:reports,alerts:alerts,climate:climate,personal:personal}[db.screen]||dashboard;m.innerHTML=f();if(db.screen==='dashboard')renderDashboardChart()}
function dashboard(){let open=db.alerts.filter(a=>a.status!=='Atendida').length;let done=db.labors.reduce((s,x)=>s+Number(x.qty||0),0);let total=db.lots.reduce((s,x)=>s+x.area,0);return shell('Panel principal','Vista general del estado de la finca y cumplimiento operativo',`<button class="btn btn-secondary" onclick="go('reports')">📄 Ver reportes</button><button class="btn btn-primary" onclick="go('labor')">＋ Registrar labor</button>`)+`<div class="grid g4"><div class="card stat"><div><div class="label">Lotes activos</div><div class="value">${db.lots.length}</div></div><div class="iconbox">🌴</div></div><div class="card stat"><div><div class="label">Superficie</div><div class="value">${total.toFixed(1)} <small style="font-size:13px">ha</small></div></div><div class="iconbox">📐</div></div><div class="card stat"><div><div class="label">Alertas abiertas</div><div class="value ${open?'kpi-bad':'kpi-good'}">${open}</div></div><div class="iconbox">🔔</div></div><div class="card stat"><div><div class="label">Avances registrados</div><div class="value">${done}</div></div><div class="iconbox">✓</div></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><h3 class="section-title">Producción y meta</h3><div id="dashchart" class="chart"></div><div class="small muted" style="margin-top:8px">Toneladas mensuales · datos de demostración</div></div><div class="card"><h3 class="section-title">Estado de la finca</h3>${db.lots.map(l=>`<div style="margin:13px 0"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:800"><span>${esc(l.name)} · ${esc(l.variety)}</span><span>${esc(l.stage)}</span></div><div class="progress" style="margin-top:6px"><span style="width:${l.stage==='Cosecha'?90:l.stage==='Polinización'?72:55}%"></span></div></div>`).join('')}</div></div><div class="grid g3" style="margin-top:14px"><div class="card"><h3 class="section-title">Clima reciente</h3><div class="value" style="font-size:25px">${db.climate.reduce((s,x)=>s+x.rain,0).toFixed(1)} mm</div><p class="small muted">Lluvia acumulada registrada</p></div><div class="card"><h3 class="section-title">Cumplimiento semanal</h3><div class="value" style="font-size:25px">${Math.round(db.plans.reduce((s,x)=>s+Math.min(1,x.done/x.target),0)/db.plans.length*100)}%</div><p class="small muted">Plan versus ejecución</p></div><div class="card"><h3 class="section-title">Conectividad</h3><div class="value kpi-good" style="font-size:20px">● Operativa</div><p class="small muted">La cola offline conserva registros pendientes.</p></div></div>`}
function renderDashboardChart(){let d=[42,38,51,47,55,49],meta=[45,45,50,50,52,52],mx=60;document.getElementById('dashchart').innerHTML=d.map((v,i)=>`<div class="bar"><b style="font-size:9px">${v}T</b><i style="height:${v/mx*150}px"></i><span>${['Ene','Feb','Mar','Abr','May','Jun'][i]}</span></div>`).join('')}
function lotes(){return shell('Plantaciones y lotes','RF-02 · RF-06 · RF-10 · estructura productiva',isAdmin()?'<button class="btn btn-primary" onclick="modalLote()">＋ Nuevo lote</button>':'')+`<div class="grid g3">${db.lots.map(l=>`<div class="card"><div style="display:flex;justify-content:space-between"><div><h3 class="section-title" style="margin-bottom:4px">${esc(l.name)}</h3><span class="badge b-green">${esc(l.stage)}</span></div><span style="font-size:25px">🌴</span></div><p class="small"><b>Variedad:</b> ${esc(l.variety)}</p><p class="small"><b>Área:</b> ${l.area} ha · <b>Palmas:</b> ${l.palms}</p><p class="small"><b>Siembra:</b> ${l.planting}</p><div class="actions"><button class="btn btn-secondary" onclick="openLot(${l.id})">Ver detalle</button>${isAdmin()?`<button class="btn btn-ghost" onclick="modalLote(${l.id})">Editar</button>`:''}</div></div>`).join('')}</div>`}
function openLot(id){selectedLot=id;modal(`<div class="modal-head"><h2>Detalle del lote</h2><button class="close" onclick="closeModal()">✕</button></div>${lotDetail(id)}`)}
function lotDetail(id){let l=db.lots.find(x=>x.id===id),hist=db.stageHistory.filter(x=>x.lot===l.name);return `<div class="grid g2"><div><h3>${esc(l.name)}</h3><p class="small muted">${esc(l.variety)} · ${l.area} ha · ${l.palms} palmas</p><div class="alert blue" style="margin-top:12px"><b>Umbral de madurez:</b> ${l.variety==='Guineensis'?3:5} frutos desprendidos.</div></div><div><label class="small"><b>Etapa actual</b></label><select id="stageSel" class="field" style="margin-top:6px"><option>Siembra</option><option>Mantenimiento</option><option>Polinización</option><option>Cosecha</option></select><button class="btn btn-primary" onclick="changeStage(${id})">Actualizar etapa</button></div></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3 class="section-title">Historial de eventos</h3>${hist.length?hist.map(x=>`<div class="small" style="padding:9px 0;border-bottom:1px solid var(--line)">${esc(x.date)} · <b>${esc(x.stage)}</b> · ${esc(x.user)}</div>`).join(''):'<p class="small muted">Sin transiciones registradas.</p>'}`}
function changeStage(id){let l=db.lots.find(x=>x.id===id),v=document.getElementById('stageSel').value;l.stage=v;db.stageHistory.push({lot:l.name,stage:v,date:new Date().toLocaleString('es-EC'),user:db.user.name});save();closeModal();render();toast('Etapa del cultivo actualizada')}
function modalLote(id){let l=id?db.lots.find(x=>x.id===id):null;modal(`<div class="modal-head"><h2>${l?'Editar lote':'Registrar lote'}</h2><button class="close" onclick="closeModal()">✕</button></div><div class="grid g2"><div class="field"><label>NOMBRE</label><input id="ln" value="${esc(l?.name||'Lote '+(db.lots.length+1))}"></div><div class="field"><label>VARIEDAD</label><select id="lv"><option ${l?.variety==='Coarí × La Mé'?'selected':''}>Coarí × La Mé</option><option ${l?.variety==='Guineensis'?'selected':''}>Guineensis</option></select></div><div class="field"><label>ÁREA (ha)</label><input id="la" type="number" step=".1" value="${l?.area||10}"></div><div class="field"><label>NÚMERO DE PALMAS</label><input id="lpals" type="number" value="${l?.palms||1000}"></div><div class="field"><label>FECHA DE SIEMBRA</label><input id="ld" type="date" value="${l?.planting||'2026-01-01'}"></div></div><button class="btn btn-primary" onclick="saveLote(${id||0})">Guardar</button>`)}
function saveLote(id){let obj={id:id||Date.now(),name:document.getElementById('ln').value,variety:document.getElementById('lv').value,area:+document.getElementById('la').value,palms:+document.getElementById('lpals').value,planting:document.getElementById('ld').value,stage:id?db.lots.find(x=>x.id===id).stage:'Mantenimiento'};if(id)db.lots=db.lots.map(x=>x.id===id?obj:x);else db.lots.push(obj);save();closeModal();render();toast('Lote guardado correctamente')}
function analysis(){return shell('Análisis asistido por IA','RF-07 · RF-08 · RF-09 · RF-21 · RNF-16 · resultado de demostración',`<span class="badge b-amber">⚠ IA de demo</span>`)+`<div class="grid g2"><div class="card"><h3 class="section-title">Captura / carga de imagen</h3><div class="field"><label>LOTE</label><select id="anLot">${db.lots.map(l=>`<option>${esc(l.name)}</option>`).join('')}</select></div><div class="field"><label>TIPO DE ANÁLISIS</label><select id="anType"><option value="plaga">Plaga / enfermedad</option><option value="nutricion">Deficiencia nutricional</option><option value="madurez">Madurez del racimo</option></select></div><div class="file-preview" id="preview">📷<div><b>Selecciona una fotografía</b><br><span class="small muted">El prototipo valida calidad y muestra una inferencia simulada.</span></div></div><input id="anFile" type="file" accept="image/*" style="margin-top:10px" onchange="previewImg(event)"><button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="runAnalysis()">Analizar imagen</button></div><div id="analysisResult" class="card"><h3 class="section-title">Resultado</h3><p class="muted small">Carga una imagen y ejecuta el análisis para mostrar clasificación, confianza, explicación y recomendación.</p></div></div><div class="card" style="margin-top:14px"><h3 class="section-title">Ficha técnica de plagas (RF-09)</h3><div class="grid g3">${[['Rhynchophorus palmarum','Coleóptero','Adulto: trampeo · Larva: control dirigido'],['Phytophthora palmivora','Oomiceto','Aislamiento y manejo fitosanitario'],['Estrategus','Coleóptero','Monitoreo de plantas jóvenes y control']].map(x=>`<div class="alert blue"><b>${x[0]}</b><br><span class="small">${x[1]} · ${x[2]}</span></div>`).join('')}</div></div>`}
function previewImg(e){let f=e.target.files[0],p=document.getElementById('preview');if(!f)return;let r=new FileReader();r.onload=()=>p.innerHTML=`<img src="${r.result}" style="max-width:100%;max-height:180px;border-radius:12px">`;r.readAsDataURL(f)}
function runAnalysis(){let type=document.getElementById('anType').value,lot=document.getElementById('anLot').value,l=db.lots.find(x=>x.name===lot),res;if(type==='plaga')res={condition:'Posible Rhynchophorus palmarum',conf:89,sev:'Alta',why:'Se observan patrones visuales compatibles con daño en tejido de la palma. El resultado es una demostración y debe ser validado por personal técnico.',rec:'Realizar inspección de campo y revisar trampas de monitoreo.'};else if(type==='nutricion')res={condition:'Posible deficiencia de potasio',conf:86,sev:'Media',why:'La explicación causal se basa en signos foliares simulados para la demostración. Debe confirmarse con análisis foliar y de suelo.',rec:'Comparar K disponible y aplicar corrección según recomendación técnica.'};else{let n=l.variety==='Guineensis'?3:5;res={condition:'Racimo maduro',conf:92,sev:'Normal',why:`La clasificación usa el desprendimiento: umbral configurado de ${n} frutos para ${l.variety}. No se utiliza el color como criterio.`,rec:'Programar cosecha y mantener la trazabilidad del lote.'};}db.analyses.unshift({date:new Date().toLocaleString('es-EC'),lot,type,...res});if(type!=='madurez')addAlert(lot,res.condition,res.sev,res.rec);save();document.getElementById('analysisResult').innerHTML=`<h3 class="section-title">Resultado del análisis</h3><div class="alert ${res.sev==='Alta'?'red':res.sev==='Media'?'amber':'blue'}"><b>${esc(res.condition)}</b><br><span class="small">Confianza: ${res.conf}% · Nivel: ${esc(res.sev)}</span></div><div style="margin-top:14px"><b class="small">Explicación (RNF-16)</b><p class="small">${esc(res.why)}</p><b class="small">Acción recomendada</b><p class="small">${esc(res.rec)}</p></div><button class="btn btn-secondary" onclick="go('alerts')">Ver alertas</button>`;toast('Análisis registrado')}
function addAlert(lot,title,sev,action){db.alerts.unshift({id:Date.now(),type:sev==='Alta'?'Crítica':'Advertencia',status:'Abierta',lot,title,desc:'Alerta generada por diagnóstico del sistema.',action})}
function labores(){return shell('Labores y avance','RF-04 · RF-13 · RF-28 · RF-26 · RF-27 · RF-35 · RF-36 · RF-37 · RF-38 · RF-39',`<button class="btn btn-primary" onclick="modalLabor()">＋ Registrar avance</button><button class="btn btn-secondary" onclick="modalPlan()">＋ Plan semanal</button>`)+`<div class="tabs"><button class="tab active">Registro diario</button><button class="tab" onclick="modalDelegado()">Registro delegado</button><button class="tab" onclick="modalNoPres()">No presupuestada</button><button class="tab" onclick="go('reports')">Liquidación</button></div><div class="grid g2"><div class="card"><h3 class="section-title">Plan semanal</h3>${db.plans.map(p=>{let pct=Math.min(100,Math.round(p.done/p.target*100));return `<div style="margin:14px 0"><div style="display:flex;justify-content:space-between;font-size:12px"><b>${p.lot} · ${p.labor}</b><b>${pct}%</b></div><div class="progress" style="margin:6px 0"><span style="width:${pct}%"></span></div><span class="small muted">${p.done}/${p.target} ${p.unit} · $${(p.target*p.rate).toFixed(2)} presupuestado</span></div>`}).join('')}</div><div class="card"><h3 class="section-title">Historial de avances</h3>${db.labors.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Labor</th><th>Persona</th><th>Lote</th><th>Avance</th><th>Origen</th></tr></thead><tbody>${db.labors.slice(0,12).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.labor)}</td><td>${esc(x.worker)}</td><td>${esc(x.lot)}</td><td><b>${x.qty}</b> ${esc(x.unit)}</td><td><span class="badge ${x.delegated?'b-purple':'b-green'}">${x.delegated?'Delegado':'Directo'}</span></td></tr>`).join('')}</tbody></table></div>`:'<p class="small muted">Aún no hay registros. Usa “Registrar avance”.</p>'}</div></div>`}
function modalLabor(){modal(`<div class="modal-head"><h2>Registrar avance de labor</h2><button class="close" onclick="closeModal()">✕</button></div>${laborForm(false)}`)}
function laborForm(delegated){return `<div class="grid g2"><div class="field"><label>LOTE</label><select id="lbLot">${db.lots.map(l=>`<option>${l.name}</option>`).join('')}</select></div><div class="field"><label>LABOR</label><select id="lbLabor" onchange="syncUnit()">${db.laborCatalog.map(x=>`<option value="${x.name}">${x.name}</option>`).join('')}</select></div><div class="field"><label>PERSONA TRABAJADORA</label><select id="lbWorker">${db.workers.map(x=>`<option>${x.name}</option>`).join('')}</select></div><div class="field"><label>CANTIDAD</label><input id="lbQty" type="number" min="0" value="100"></div><div class="field"><label>UNIDAD</label><input id="lbUnit" value="${db.laborCatalog[0].unit}" readonly></div><div class="field"><label>FECHA</label><input id="lbDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div class="alert blue small">La tarifa se obtiene del catálogo codificado (RF-36). Valor estimado: <b id="lbCost">$18.00</b></div><button class="btn btn-primary" onclick="saveLabor(${delegated})">Guardar avance</button>`}
function syncUnit(){let x=db.laborCatalog.find(x=>x.name===document.getElementById('lbLabor').value);document.getElementById('lbUnit').value=x.unit;document.getElementById('lbCost').textContent='$'+(x.rate*+document.getElementById('lbQty').value).toFixed(2)}
function saveLabor(delegated){let name=document.getElementById('lbLabor').value,x=db.laborCatalog.find(x=>x.name===name),rec={id:Date.now(),date:document.getElementById('lbDate').value,lot:document.getElementById('lbLot').value,labor:name,worker:document.getElementById('lbWorker').value,qty:+document.getElementById('lbQty').value,unit:x.unit,rate:x.rate,delegated:!!delegated,registeredBy:delegated?db.user.name:document.getElementById('lbWorker').value};db.labors.unshift(rec);db.audit.unshift({date:new Date().toLocaleString('es-EC'),user:db.user.name,action:delegated?'Registro delegado de avance':'Registro de avance',detail:rec.worker+' · '+rec.qty+' '+rec.unit});save();closeModal();render();toast('Avance guardado')}
function modalPlan(){modal(`<div class="modal-head"><h2>Planificación semanal · RF-26</h2><button class="close" onclick="closeModal()">✕</button></div><div class="grid g2"><div class="field"><label>SEMANA</label><input id="pw" value="2026-W36"></div><div class="field"><label>LOTE</label><select id="pl"><option>Lote 1</option><option>Lote 2</option><option>Lote 3</option><option>Lote 4</option></select></div><div class="field"><label>LABOR</label><select id="pt">${db.laborCatalog.map(x=>`<option>${x.name}</option>`).join('')}</select></div><div class="field"><label>META / UNIDADES</label><input id="pm" type="number" value="1000"></div></div><button class="btn btn-primary" onclick="savePlan()">Guardar plan</button>`)}
function savePlan(){let name=document.getElementById('pt').value,x=db.laborCatalog.find(x=>x.name===name);db.plans.push({id:Date.now(),week:document.getElementById('pw').value,lot:document.getElementById('pl').value,labor:name,unit:x.unit,target:+document.getElementById('pm').value,done:0,rate:x.rate});save();closeModal();render();toast('Plan semanal creado')}
function modalDelegado(){if(!isSup()){toast('Solo supervisión puede registrar avances delegados');return}modal(`<div class="modal-head"><h2>Registro delegado · RF-35</h2><button class="close" onclick="closeModal()">✕</button></div><div class="alert amber small">Este registro conserva quién ingresó el avance y a nombre de qué trabajador se registró.</div>${laborForm(true)}`)}
function modalNoPres(){modal(`<div class="modal-head"><h2>Labor no presupuestada · RF-38</h2><button class="close" onclick="closeModal()">✕</button></div><div class="grid g2"><div class="field"><label>LABOR</label><select id="npL">${db.laborCatalog.map(x=>`<option>${x.name}</option>`).join('')}</select></div><div class="field"><label>LOTE</label><select id="npLot">${db.lots.map(x=>`<option>${x.name}</option>`).join('')}</select></div><div class="field"><label>CANTIDAD</label><input id="npQ" type="number" value="50"></div><div class="field"><label>MOTIVO</label><input id="npM" placeholder="Emergencia fitosanitaria"></div></div><button class="btn btn-primary" onclick="saveNoPres()">Registrar</button>`)}
function saveNoPres(){db.labors.unshift({id:Date.now(),date:new Date().toISOString().slice(0,10),lot:document.getElementById('npLot').value,labor:document.getElementById('npL').value,worker:db.user.name,qty:+document.getElementById('npQ').value,unit:'unidades',rate:0,nonBudgeted:true,motivo:document.getElementById('npM').value});save();closeModal();render();toast('Labor no presupuestada registrada')}
function gps(){let consent=Object.values(db.consents).some(Boolean);return shell('Mapa GPS y polinización','RF-13 · RF-14 · RF-15 · RF-30 · RNF-05 · consentimiento LOPDP',`<span class="badge ${consent?'b-green':'b-amber'}">${consent?'Consentimiento vigente':'Consentimiento requerido'}</span>`)+`<div class="grid g2"><div class="card"><h3 class="section-title">Recorrido de demostración</h3><div class="map"><div class="route" style="left:12%;top:35%;width:34%;transform:rotate(18deg)"></div><div class="route" style="left:42%;top:47%;width:28%;transform:rotate(-24deg)"></div><div class="route" style="left:65%;top:35%;width:23%;transform:rotate(70deg)"></div><div class="pin" style="left:19%;top:29%;background:#16a34a"></div><div class="pin" style="left:45%;top:48%;background:#2563eb"></div><div class="pin" style="left:70%;top:30%;background:#7c3aed"></div><div class="pin" style="left:62%;top:65%;background:#d97706"></div></div><div class="actions" style="margin-top:10px"><button class="btn btn-primary" onclick="gpsMark()">＋ Registrar marcación</button><button class="btn btn-secondary" onclick="requestGPS()">Usar GPS del dispositivo</button></div><p class="small muted">La ruta dibujada es de demostración. Si el navegador concede permiso, se registra una coordenada real.</p></div><div class="card"><h3 class="section-title">Conteo georreferenciado</h3><div class="grid g2"><div><div class="value" style="font-size:30px">${db.labors.filter(x=>x.labor==='Polinización').reduce((s,x)=>s+x.qty,0)+142}</div><div class="small muted">Flores polinizadas</div></div><div><div class="value" style="font-size:30px">${db.labors.filter(x=>x.labor==='Polinización').length+4}</div><div class="small muted">Marcaciones</div></div></div><hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><h4 style="margin:0 0 8px">Privacidad</h4><label class="small"><input type="checkbox" ${consent?'checked':''} onchange="setConsent(this.checked)"> Autorizo el uso de geolocalización para supervisión de labores. Puede revocarse sin consecuencia laboral.</label></div></div>`}
function setConsent(v){db.consents[db.user.u]=v;db.audit.unshift({date:new Date().toLocaleString('es-EC'),user:db.user.name,action:v?'Consentimiento GPS otorgado':'Consentimiento GPS revocado',detail:'LOPDP'});save();render();toast(v?'Consentimiento registrado':'Consentimiento revocado')}
function gpsMark(){db.labors.unshift({id:Date.now(),date:new Date().toISOString().slice(0,10),lot:'Lote 2',labor:'Polinización',worker:db.user.name,qty:1,unit:'flor',rate:.12,gps:true});save();render();toast('Marcación GPS registrada')}
function requestGPS(){if(!navigator.geolocation){toast('Este navegador no ofrece geolocalización');return}navigator.geolocation.getCurrentPosition(p=>{db.audit.unshift({date:new Date().toLocaleString('es-EC'),user:db.user.name,action:'Marcación GPS',detail:`${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`});save();toast('Ubicación obtenida y registrada')},()=>toast('No se pudo obtener el GPS. Se conserva el registro parcial.'))}
function quality(){return shell('Calidad y relación con extractora','RF-21 · RF-22 · RF-23 · RF-24 · RF-25 · RF-32 · RF-33',`<button class="btn btn-primary" onclick="modalTicket()">＋ Ticket de pesaje</button><button class="btn btn-secondary" onclick="exportEstimate()">↗ Exportar estimación</button>`)+`<div class="grid g3"><div class="card"><h3 class="section-title">Madurez por desprendimiento</h3><div class="value" style="font-size:28px">${db.maturity.length}</div><p class="small muted">Racimos clasificados</p><button class="btn btn-secondary" onclick="modalMaturity()">Registrar clasificación</button></div><div class="card"><h3 class="section-title">Fruta verde estimada</h3><div class="value ${greenPct()>=db.settings.greenThreshold?'kpi-bad':'kpi-good'}" style="font-size:28px">${greenPct().toFixed(1)}%</div><p class="small muted">Umbral configurable: ${db.settings.greenThreshold}%</p></div><div class="card"><h3 class="section-title">Ventana corte → entrega</h3><div class="value kpi-good" style="font-size:28px">${db.settings.deliveryHours} h</div><p class="small muted">Umbral de advertencia</p></div></div><div class="card" style="margin-top:14px"><h3 class="section-title">Entregas y trazabilidad</h3>${db.tickets.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Lote</th><th>Neto</th><th>Verde</th><th>Guía</th><th>Ventana</th></tr></thead><tbody>${db.tickets.map(t=>`<tr><td>${t.date}</td><td>${t.lot}</td><td>${t.net} kg</td><td>${t.green}%</td><td>${t.guide||'<span class="badge b-amber">Falta</span>'}</td><td>${t.hours} h ${t.hours>db.settings.deliveryHours?'<span class="badge b-red">Advertencia</span>':''}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small muted">Registra un ticket de pesaje para iniciar la trazabilidad.</p>'}</div>`}
function greenPct(){if(!db.maturity.length)return 2.4;return db.maturity.filter(x=>x.state==='Verde').length/db.maturity.length*100}
function modalMaturity(){modal(`<div class="modal-head"><h2>Clasificar madurez · RF-21</h2><button class="close" onclick="closeModal()">✕</button></div><div class="grid g2"><div class="field"><label>LOTE</label><select id="ml">${db.lots.map(l=>`<option>${l.name}</option>`).join('')}</select></div><div class="field"><label>FRUTOS DESPRENDIDOS</label><input id="mf" type="number" min="0" value="5"></div></div><div class="alert blue small">El sistema usa solo el desprendimiento. Umbral: Guineensis 3; híbrido Coarí × La Mé 5.</div><button class="btn btn-primary" onclick="saveMaturity()">Clasificar</button>`)}
function saveMaturity(){let lot=document.getElementById('ml').value,l=db.lots.find(x=>x.name===lot),n=+document.getElementById('mf').value,th=l.variety==='Guineensis'?3:5,state=n<th?'Verde':n===th?'Maduro':'Sobremaduro';db.maturity.unshift({date:new Date().toISOString().slice(0,10),lot,detached:n,state,threshold:th});save();closeModal();render();toast('Clasificación guardada')}
function modalTicket(){modal(`<div class="modal-head"><h2>Ticket de pesaje · RF-23 / RF-25 / RF-33</h2><button class="close" onclick="closeModal()">✕</button></div><div class="grid g2"><div class="field"><label>LOTE</label><select id="tl">${db.lots.map(l=>`<option>${l.name}</option>`).join('')}</select></div><div class="field"><label>FECHA</label><input id="td" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>PESO BRUTO (kg)</label><input id="tb" type="number" value="12000"></div><div class="field"><label>TARA (kg)</label><input id="tt" type="number" value="2500"></div><div class="field"><label>% FRUTA VERDE</label><input id="tg" type="number" step=".1" value="2.2"></div><div class="field"><label>GUÍA DE REMISIÓN</label><input id="tgu" placeholder="GR-2026-001"></div><div class="field"><label>HORAS CORTE → ENTREGA</label><input id="th" type="number" value="18"></div><div class="field"><label>CALIFICACIÓN</label><select id="tq"><option>Óptima</option><option>Con observaciones</option><option>Penalizada</option></select></div></div><button class="btn btn-primary" onclick="saveTicket()">Guardar ticket</button>`)}
function saveTicket(){let bruto=+document.getElementById('tb').value,tara=+document.getElementById('tt').value,t={date:document.getElementById('td').value,lot:document.getElementById('tl').value,net:bruto-tara,green:+document.getElementById('tg').value,guide:document.getElementById('tgu').value,hours:+document.getElementById('th').value,quality:document.getElementById('tq').value};db.tickets.unshift(t);if(!t.guide)addAlert(t.lot,'Despacho sin guía de remisión','Advertencia','Registrar la guía antes del cierre del despacho.');if(t.green>=db.settings.greenThreshold)addAlert(t.lot,'Alerta preventiva de fruta verde','Crítica','Revisar clasificación antes del despacho.');save();closeModal();render();toast('Ticket de pesaje registrado')}
function exportEstimate(){let rows=[['periodo','lote','conteo_racimos','peso_promedio_estimado_kg']];db.lots.forEach(l=>rows.push(['2026-09',l.name,Math.round(l.palms*.08),Math.round(l.palms*.08*18)]));download('simpa_estimacion_extractora.csv',rows.map(r=>r.join(',')).join('\n'),'text/csv');toast('Exportación sin datos personales generada')}
function reports(){let totalPlan=db.plans.reduce((s,x)=>s+x.target*x.rate,0),real=db.labors.reduce((s,x)=>s+(x.nonBudgeted?x.qty*x.rate:x.qty*x.rate),0);return shell('Reportes, estimación e histórico','RF-18 · RF-19 · RF-20 · RF-29 · RF-32 · liquidación semanal',`<button class="btn btn-secondary" onclick="print()">🖨 Imprimir / PDF</button><button class="btn btn-primary" onclick="exportCSV()">↗ Exportar CSV</button>`)+`<div class="grid g4"><div class="card stat"><div><div class="label">Producción estimada</div><div class="value">${productionEstimate()} T</div></div><div class="iconbox">📈</div></div><div class="card stat"><div><div class="label">Presupuesto</div><div class="value">$${totalPlan.toFixed(0)}</div></div><div class="iconbox">💰</div></div><div class="card stat"><div><div class="label">Ejecución registrada</div><div class="value">$${real.toFixed(0)}</div></div><div class="iconbox">🧾</div></div><div class="card stat"><div><div class="label">Cumplimiento</div><div class="value">${Math.round(db.plans.reduce((s,x)=>s+x.done/x.target,0)/db.plans.length*100)}%</div></div><div class="iconbox">✓</div></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><h3 class="section-title">Liquidación semanal · RF-37 / RF-39</h3><div class="table-wrap"><table class="table"><thead><tr><th>Labor</th><th>Plan</th><th>Ejecutado</th><th>Tarifa</th><th>Valor</th><th>Cumpl.</th></tr></thead><tbody>${db.plans.map(p=>`<tr><td>${p.labor}</td><td>${p.target}</td><td>${p.done}</td><td>$${p.rate}</td><td>$${(p.done*p.rate).toFixed(2)}</td><td><span class="badge ${p.done>=p.target?'b-green':'b-amber'}">${Math.round(p.done/p.target*100)}%</span></td></tr>`).join('')}</tbody></table></div><button class="btn btn-primary" style="margin-top:12px" onclick="approveSettlement()">✓ Aprobar liquidación</button></div><div class="card"><h3 class="section-title">Historial por lote · RF-20</h3><div class="field"><label>FILTRAR LOTE</label><select id="hf" onchange="renderHistory()"><option>Todos</option>${db.lots.map(l=>`<option>${l.name}</option>`).join('')}</select></div><div id="history"></div></div></div><div class="card" style="margin-top:14px"><h3 class="section-title">Estimación de producción · RF-18</h3><p class="small muted">Cálculo demostrativo basado en censo de flores, racimos en desarrollo y rendimiento de variedad. Para producción real debe conectarse a datos de campo validados.</p><div class="grid g3">${db.lots.map(l=>`<div class="alert blue"><b>${l.name}</b><br><span class="small">Racimos estimados: ${Math.round(l.palms*.08)} · Producción: ${(l.palms*.08*18/1000).toFixed(1)} T</span></div>`).join('')}</div></div>`}
function productionEstimate(){return db.lots.reduce((s,l)=>s+l.palms*.08*18/1000,0).toFixed(1)}
function renderHistory(){let el=document.getElementById('history'),v=document.getElementById('hf')?.value||'Todos';let arr=[...db.labors.map(x=>({date:x.date,lot:x.lot,type:'Labor',desc:x.labor+' · '+x.qty+' '+x.unit})),...db.analyses.map(x=>({date:x.date,lot:x.lot,type:'IA',desc:x.condition})),...db.alerts.map(x=>({date:'',lot:x.lot,type:'Alerta',desc:x.title}))].filter(x=>v==='Todos'||x.lot===v).slice(0,15);el.innerHTML=arr.length?arr.map(x=>`<div class="small" style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${x.date}</b> · ${x.lot} · <span class="badge b-blue">${x.type}</span> ${esc(x.desc)}</div>`).join(''):'<p class="small muted">Sin eventos.</p>'}
function approveSettlement(){if(!isAdmin()){toast('Solo Administrador puede aprobar la liquidación');return}db.audit.unshift({date:new Date().toLocaleString('es-EC'),user:db.user.name,action:'Aprobación de liquidación semanal',detail:'Período cerrado con trazabilidad'});save();toast('Liquidación aprobada y registrada en bitácora')}
function exportCSV(){let rows=[['fecha','lote','labor','persona','cantidad','unidad','delegado'],...db.labors.map(x=>[x.date,x.lot,x.labor,x.worker,x.qty,x.unit,x.delegated?'SI':'NO'])];download('simpa_reporte_labores.csv',rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')}
function climate(){let total=db.climate.reduce((s,x)=>s+x.rain,0);return shell('Clima y precipitación','RF-17 · consulta de datos climáticos',`<button class="btn btn-primary" onclick="modalClimate()">＋ Registrar lluvia</button>`)+`<div class="grid g3"><div class="card"><div class="label">Acumulado registrado</div><div class="value" style="font-size:30px">${total.toFixed(1)} mm</div><p class="small muted">Período disponible en el prototipo</p></div><div class="card"><div class="label">Promedio diario</div><div class="value" style="font-size:30px">${(total/db.climate.length).toFixed(1)} mm</div></div><div class="card"><div class="label">Última lectura</div><div class="value" style="font-size:20px">${db.climate.at(-1)?.date||'—'}</div></div></div><div class="card" style="margin-top:14px"><h3 class="section-title">Histórico</h3><table class="table"><thead><tr><th>Fecha</th><th>Precipitación</th></tr></thead><tbody>${db.climate.map(x=>`<tr><td>${x.date}</td><td>${x.rain} mm</td></tr>`).join('')}</tbody></table></div>`}
function modalClimate(){modal(`<div class="modal-head"><h2>Registrar lectura climática</h2><button class="close" onclick="closeModal()">✕</button></div><div class="grid g2"><div class="field"><label>FECHA</label><input id="cd" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>LLUVIA (mm)</label><input id="cr" type="number" step=".1" value="0"></div></div><button class="btn btn-primary" onclick="saveClimate()">Guardar</button>`)}
function saveClimate(){db.climate.push({date:document.getElementById('cd').value,rain:+document.getElementById('cr').value});save();closeModal();render();toast('Lectura climática guardada')}
function alerts(){return shell('Alertas tempranas','RF-12 · RF-22 · incidencias y acciones recomendadas')+`<div class="tabs">${['Todas','Crítica','Advertencia','Atendida'].map(f=>`<button class="tab" onclick="filterAlerts('${f}')">${f} ${f==='Todas'?'('+db.alerts.length+')':''}</button>`).join('')}</div><div id="alertList">${alertCards(db.alerts)}</div>`}
function alertCards(arr){return `<div class="grid g2">${arr.map(a=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><div><span class="badge ${a.type==='Crítica'?'b-red':a.type==='Advertencia'?'b-amber':'b-blue'}">${a.type}</span><h3 class="section-title" style="margin:8px 0 3px">${esc(a.title)}</h3><p class="small muted">${a.lot}</p></div><span class="badge ${a.status==='Atendida'?'b-green':'b-gray'}">${a.status}</span></div><p class="small">${esc(a.desc)}</p><div class="alert blue small"><b>Acción recomendada:</b> ${esc(a.action)}</div>${a.status!=='Atendida'?`<button class="btn btn-primary" onclick="attend(${a.id})">✓ Marcar atendida</button>`:''}</div>`).join('')}</div>`}
function filterAlerts(f){let arr=f==='Todas'?db.alerts:f==='Atendida'?db.alerts.filter(x=>x.status==='Atendida'):db.alerts.filter(x=>x.type===f);document.getElementById('alertList').innerHTML=alertCards(arr)}
function attend(id){let a=db.alerts.find(x=>x.id===id);a.status='Atendida';db.audit.unshift({date:new Date().toLocaleString('es-EC'),user:db.user.name,action:'Alerta atendida',detail:a.title});save();render();toast('Alerta marcada como atendida')}
function personal(){return shell('Personal, equipos y cuentas','RF-03 · RF-35 · RL-01 · RL-04 · control de acceso',`<button class="btn btn-primary" onclick="modalWorker()">＋ Nuevo personal</button><button class="btn btn-secondary" onclick="modalAccount()">＋ Cuenta</button>`)+`<div class="grid g2"><div class="card"><h3 class="section-title">Personal y equipos</h3><div class="table-wrap"><table class="table"><thead><tr><th>Persona</th><th>Equipo</th><th>Lote</th><th>Dispositivo</th><th>GPS</th></tr></thead><tbody>${db.workers.map(w=>`<tr><td><b>${esc(w.name)}</b></td><td>${esc(w.team)}</td><td>${esc(w.lot)}</td><td>${w.smart?'Sí':'No'}</td><td><span class="badge ${db.consents[w.name]?'b-green':'b-amber'}">${db.consents[w.name]?'Consentido':'Pendiente'}</span></td></tr>`).join('')}</tbody></table></div></div><div class="card"><h3 class="section-title">Cuentas y roles</h3>${db.accounts.map(a=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)"><div><b>${esc(a.u)}</b><br><span class="small muted">${esc(a.role)}</span></div><button class="btn btn-ghost" onclick="changePwd('${a.u}')">Cambiar clave</button></div>`).join('')}</div></div><div class="card" style="margin-top:14px"><h3 class="section-title">Bitácora de seguridad y trazabilidad</h3>${db.audit.slice(0,20).map(x=>`<div class="small" style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(x.date)}</b> · ${esc(x.user)} · ${esc(x.action)} — ${esc(x.detail)}</div>`).join('')||'<p class="small muted">No hay eventos registrados.</p>'}</div>`}
function modalWorker(){modal(`<div class="modal-head"><h2>Registrar personal</h2><button class="close" onclick="closeModal()">✕</button></div><div class="grid g2"><div class="field"><label>NOMBRE</label><input id="wn"></div><div class="field"><label>EQUIPO</label><select id="wt"><option>Administración</option><option>Polinización</option><option>Control fitosanitario</option><option>Riego</option><option>Labores agrícolas</option></select></div><div class="field"><label>LOTE</label><select id="wl">${db.lots.map(l=>`<option>${l.name}</option>`).join('')}</select></div><div class="field"><label>TELÉFONO</label><input id="wp"></div></div><label class="small"><input id="ws" type="checkbox" checked> Dispone de teléfono inteligente</label><button class="btn btn-primary" style="margin-top:12px" onclick="saveWorker()">Guardar</button>`)}
function saveWorker(){db.workers.push({id:Date.now(),name:document.getElementById('wn').value,team:document.getElementById('wt').value,lot:document.getElementById('wl').value,phone:document.getElementById('wp').value,smart:document.getElementById('ws').checked});save();closeModal();render();toast('Personal registrado')}
function modalAccount(){modal(`<div class="modal-head"><h2>Nueva cuenta</h2><button class="close" onclick="closeModal()">✕</button></div><div class="grid g2"><div class="field"><label>USUARIO</label><input id="au"></div><div class="field"><label>NOMBRE</label><input id="an"></div><div class="field"><label>CONTRASEÑA</label><input id="ap" type="password"></div><div class="field"><label>ROL</label><select id="ar"><option>Administrador</option><option>Supervisor</option><option>Operario</option></select></div></div><div class="alert amber small">En esta versión HTML la autenticación es local. Para producción, trasladar credenciales a un backend con derivación de clave y TLS.</div><button class="btn btn-primary" onclick="saveAccount()">Crear cuenta</button>`)}
function saveAccount(){let u=document.getElementById('au').value;if(db.accounts.some(x=>x.u===u)){toast('El usuario ya existe');return}db.accounts.push({u,p:document.getElementById('ap').value,role:document.getElementById('ar').value,name:document.getElementById('an').value});save();closeModal();render();toast('Cuenta creada')}
function changePwd(u){let p=prompt('Nueva contraseña para '+u+':');if(p){db.accounts.find(x=>x.u===u).p=p;save();toast('Contraseña actualizada en el almacenamiento local')}}
function modal(html){let m=document.getElementById('modal');m.className='modal';m.innerHTML='<div class="modal-card">'+html+'</div>'}function closeModal(){let m=document.getElementById('modal');m.className='hidden';m.innerHTML=''}
function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
window.addEventListener('online',()=>{let n=document.getElementById('net');if(n){n.textContent='● En línea';n.className='status'};syncQueue()});window.addEventListener('offline',()=>{let n=document.getElementById('net');if(n){n.textContent='● Sin conexión';n.className='status offline'}});function syncQueue(){if(db.offlineQueue.length){toast('Sincronización simulada: '+db.offlineQueue.length+' registros pendientes');db.offlineQueue=[];save()}}
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
app();
</script>
</body></html>
